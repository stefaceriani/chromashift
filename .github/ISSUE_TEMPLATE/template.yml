name: Template
description: Suggest a new feature or enhancement for ChromaShift
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Grazie per il tuo suggerimento! Compila i campi qui sotto per aiutarci a capire meglio la tua idea. 🎨

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: A cosa si riferisce questa feature?
      options:
        - Extension (chromashift.js)
        - Preset
        - Website (chromashift.qzz.io)
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 📄 Idea
      description: Describe the feature you'd like to see.
      placeholder: e.g. Add an option to auto-generate a color palette from the current album art
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: ✒️ Why it's useful
      description: Explain the value this feature would add, and who would benefit from it.
      placeholder: e.g. Would save time for users who don't want to manually pick colors for every album
    validations:
      required: true

  - type: textarea
    id: mockup
    attributes:
      label: 🖼️ Mockup / reference (optional)
      description: Screenshot, sketch, or link to something similar elsewhere. You can drag and drop images here.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: ⚖️ Alternatives considered (optional)
      description: Any alternative solutions or features you've considered.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: ✅ Checklist
      options:
        - label: I searched existing issues to avoid duplicates
          required: true
        - label: I'm using the latest version of ChromaShift
          required: true
