name: Build chromashift.js

on:
  push:
    branches: [main]
    paths: ["src/**", "build.js"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.js
      - name: Bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chromashift.js
          git diff --cached --quiet || git commit -m "chore: rebuild chromashift.js"
          git push
